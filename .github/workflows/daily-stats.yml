name: Codemao Daily Stat

on:
  workflow_dispatch:
  schedule:
    - cron: "50 15 * * *"

env:
    CODEMAO_PHONE: ${{ secrets.CODEMAO_PHONE }}
    CODEMAO_PASSWORD: ${{ secrets.CODEMAO_PASSWORD }}
    
permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install CodemaoEDUTools

      - name: Run stat script
        run: |
          python main.py

      - name: Commit status.json
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add status.json
          git commit -m "Update daily status" || echo "No changes"
          git push
