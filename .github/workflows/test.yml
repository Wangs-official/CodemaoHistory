name: TestPIP

on:
  workflow_dispatch:

env:
    CODEMAO_PHONE: ${{ secrets.CODEMAO_PHONE }}
    CODEMAO_PASSWORD: ${{ secrets.CODEMAO_PASSWORD }}
    
permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install CodemaoEDUTools==2.1.0
